        font-size="200" fill="#3ddc84" text-anchor="middle">&gt;</text>
  <rect x="212" y="266" width="118" height="26" rx="7" fill="#3ddc84"/>
  <text x="256" y="412" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-weight="700"
        font-size="100" fill="#e6e6e6" text-anchor="middle">tt</text>
</svg>
